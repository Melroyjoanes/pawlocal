name: Trial expiry cron

# Vercel's free (Hobby) plan only runs cron jobs once a day, but the
# trial-expiry email logic needs to check hourly to catch the "ending soon"
# email in its 3-4 hour window before real expiry. This workflow calls the
# same endpoint on GitHub's own scheduler instead, which has no such limit.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  call-trial-expiry:
    runs-on: ubuntu-latest
    steps:
      - name: Call trial-expiry endpoint
        run: |
          # --retry covers transient upstream failures (Razorpay/Supabase 5xx,
          # timeouts) which previously turned a one-off blip into a red X.
          # A 401 is NOT retried on purpose — that means the secret is wrong
          # and retrying would only hide it.
          # --fail-with-body prints the server's error instead of a bare exit 22.
          curl --fail-with-body -sS \
            --retry 4 --retry-delay 15 \
            --connect-timeout 15 --max-time 120 \
            -X GET "https://pupstep.in/api/cron/trial-expiry" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
