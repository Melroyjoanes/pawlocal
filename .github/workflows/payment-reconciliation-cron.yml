name: Payment reconciliation cron

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch: {}

jobs:
  call-payment-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - name: Call payment-reconciliation endpoint
        run: |
          curl -sf -X GET "https://pupstep.in/api/cron/payment-reconciliation" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
