name: Walker no-show cron

# Disabled: this cron emails the parent whenever a walker hasn't logged a
# report yet that day. /home already surfaces the same situation live
# in-app ("No walk yet today" + a Remind button the parent taps themselves),
# so the automated email was just an unwanted duplicate notification.
# workflow_dispatch kept for manual/future use; schedule trigger removed.
on:
  workflow_dispatch: {}

jobs:
  call-walker-noshow:
    runs-on: ubuntu-latest
    steps:
      - name: Call walker-noshow endpoint
        run: |
          # --retry covers transient upstream failures (Razorpay/Supabase 5xx,
          # timeouts) which previously turned a one-off blip into a red X.
          # A 401 is NOT retried on purpose — that means the secret is wrong
          # and retrying would only hide it.
          # --fail-with-body prints the server's error instead of a bare exit 22.
          curl --fail-with-body -sS \
            --retry 4 --retry-delay 15 \
            --connect-timeout 15 --max-time 120 \
            -X GET "https://pupstep.in/api/cron/walker-noshow" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
