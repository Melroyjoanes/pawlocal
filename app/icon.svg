<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Amber/golden background -->
  <rect width="32" height="32" rx="8" fill="#F59E0B"/>
  <!-- Subtle inner highlight -->
  <rect width="32" height="16" rx="8" fill="#FCD34D" opacity="0.3"/>

  <!-- Paw: white fill -->
  <!-- Main pad -->
  <ellipse cx="16" cy="19.5" rx="5.5" ry="4.5" fill="#FFFBEB"/>
  <!-- Toes -->
  <ellipse cx="10.5" cy="13.5" rx="2.2" ry="2.6" fill="#FFFBEB"/>
  <ellipse cx="14"   cy="11.5" rx="2.2" ry="2.6" fill="#FFFBEB"/>
  <ellipse cx="18"   cy="11.5" rx="2.2" ry="2.6" fill="#FFFBEB"/>
  <ellipse cx="21.5" cy="13.5" rx="2.2" ry="2.6" fill="#FFFBEB"/>

  <!-- Brown texture on main pad: inner darker oval + 3 knuckle marks -->
  <ellipse cx="16" cy="19.5" rx="3.2" ry="2.5" fill="#92400E" opacity="0.18"/>
  <ellipse cx="14.3" cy="18.8" rx="0.9" ry="0.7" fill="#78350F" opacity="0.38"/>
  <ellipse cx="17.7" cy="18.8" rx="0.9" ry="0.7" fill="#78350F" opacity="0.38"/>
  <ellipse cx="16"   cy="21"   rx="1"   ry="0.7" fill="#78350F" opacity="0.38"/>

  <!-- Brown texture on toes: small inner ovals -->
  <ellipse cx="10.5" cy="13.5" rx="1.1" ry="1.3" fill="#92400E" opacity="0.22"/>
  <ellipse cx="14"   cy="11.5" rx="1.1" ry="1.3" fill="#92400E" opacity="0.22"/>
  <ellipse cx="18"   cy="11.5" rx="1.1" ry="1.3" fill="#92400E" opacity="0.22"/>
  <ellipse cx="21.5" cy="13.5" rx="1.1" ry="1.3" fill="#92400E" opacity="0.22"/>
</svg>
